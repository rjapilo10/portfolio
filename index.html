<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ryrie John — Cold Outreach. Booked Calls.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAFAF8;
    --fg: #1A1A1A;
    --muted: #F5F3F0;
    --muted-fg: #6B6B6B;
    --accent: #B8860B;
    --accent-2: #D4A84B;
    --border: #E8E4DF;
    --card: #FFFFFF;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Source Sans 3', sans-serif;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3{
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .wrap{
    max-width: 780px;
    margin: 0 auto;
    padding: 0 28px;
  }

  a{ color: inherit; }
  p{ color: var(--muted-fg); }

  nav{
    position: sticky;
    top: 0;
    background: rgba(250,250,248,0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }
  nav .wrap{
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 68px;
    max-width: 900px;
  }
  .brand{
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 600;
  }
  .nav-cta{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    border: 1px solid var(--fg);
    padding: 9px 16px;
    border-radius: 6px;
    transition: all 0.2s ease-out;
  }
  .nav-cta:hover{
    background: var(--fg);
    color: var(--bg);
  }

  .section-label{
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
  }
  .section-label .rule{
    height: 1px;
    flex: 1;
    background: var(--border);
  }
  .section-label span.txt{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
  }

  section{ padding: 80px 0; }
  section.alt{ background: var(--muted); }

  .hero{
    padding: 96px 0 80px;
    text-align: center;
  }
  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
  }
  .hero h1{
    font-size: clamp(30px, 5vw, 46px);
    line-height: 1.18;
    max-width: 15ch;
    margin: 0 auto;
  }
  .hero p.sub{
    max-width: 46ch;
    margin: 22px auto 0;
    font-size: 17px;
  }
  .cta-row{
    display: flex;
    gap: 14px;
    justify-content: center;
    margin-top: 34px;
    flex-wrap: wrap;
  }
  .btn{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 24px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s ease-out;
    min-height: 44px;
  }
  .btn-primary{
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover{
    background: var(--accent-2);
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(184,134,11,0.22);
  }
  .btn-ghost{
    border: 1px solid var(--fg);
    color: var(--fg);
  }
  .btn-ghost:hover{
    background: var(--muted);
    border-color: var(--accent);
    color: var(--accent);
  }

  .card{
    background: var(--card);
    border: 1px solid var(--border);
    border-top: 2px solid var(--accent);
    border-radius: 8px;
    padding: 26px 24px;
    box-shadow: 0 1px 2px rgba(26,26,26,0.04);
    transition: all 0.2s ease-out;
  }
  .card:hover{
    box-shadow: 0 4px 12px rgba(26,26,26,0.06);
    background: rgba(245,243,240,0.5);
  }
  .service-grid{
    display: grid;
    gap: 16px;
  }
  .card h3{ font-size: 18px; margin-bottom: 8px; }
  .card p{ font-size: 14.5px; margin: 0; }

  .bonus{
    margin-top: 24px;
    padding: 20px 24px;
    border-left: 2px solid var(--accent);
    background: var(--muted);
    border-radius: 0 8px 8px 0;
  }
